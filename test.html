<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>app.js syntax check</title>
</head>
<body>
<p id="result">CHECKING app.js SYNTAX...</p>
<script>
fetch('app.js').then(function(r) {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}).then(function(code) {
  try {
    new Function(code);
    document.getElementById('result').textContent = 'app.js SYNTAX OK (' + code.length + ' chars)';
  } catch (e) {
    document.getElementById('result').textContent = 'app.js SYNTAX ERROR: ' + e.message;
  }
}).catch(function(e) {
  document.getElementById('result').textContent = 'FETCH FAILED: ' + e.message;
});
</script>
</body>
</html>
